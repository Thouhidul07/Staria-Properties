version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: staria-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: staria_properties
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d staria_properties"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: staria-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      API_PREFIX: /api/v1
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/staria_properties?schema=public
      JWT_ACCESS_SECRET: staria-super-secret-access-token-key-change-in-prod-32bytes
      JWT_REFRESH_SECRET: staria-super-secret-refresh-token-key-change-in-prod-32bytes
      CORS_ORIGIN: http://localhost:80,http://localhost:5173
      FRONTEND_URL: http://localhost:80
      ADMIN_APP_URL: http://localhost:80
      LOG_LEVEL: info
      RUN_SEED: "true"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: staria-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local
